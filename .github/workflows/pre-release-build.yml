name: Pre-release Build Check

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64 i686
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: windows-latest
            archs: AMD64 x86
          # x86_64 wheels are cross-compiled and tested through Rosetta
          - os: macos-latest
            archs: arm64 x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache cibuildwheel downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibuildwheel-${{ runner.os }}-${{ runner.arch }}-v4.3.1
      - name: Build wheels with retry
        shell: bash
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==4.3.1
          for attempt in 1 2 3; do
            echo "cibuildwheel attempt ${attempt}/3"
            python -m cibuildwheel . --output-dir wheelhouse && break
            if [ "${attempt}" -eq 3 ]; then
              echo "cibuildwheel failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build deps
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist
        run: python -m build --sdist
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Build a wheel from the sdist and run its tests
        run: |
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python -m pip install "$(ls sdist-wheel/*.whl)[test]"
          mkdir sdist-test && tar -xzf dist/*.tar.gz -C sdist-test --strip-components=1
          cd "$RUNNER_TEMP" && python -m pytest -p no:cacheprovider -q "$GITHUB_WORKSPACE/sdist-test/tests"
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7
